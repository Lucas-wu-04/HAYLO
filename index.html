<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Haylo — Task-based Productivity App</title>
<meta name="description" content="Haylo — a calm, task-based productivity app. Pick one thing, focus, check it off." />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" id="themeColor" content="#EFEFEC" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Haylo" />
<meta name="mobile-web-app-capable" content="yes" />
<meta property="og:title" content="Haylo" />
<meta property="og:description" content="Pick one thing. Focus. Check it off." />
<meta property="og:type" content="website" />
<!-- Self-hosted fonts: no third-party requests, works fully offline. -->
<link rel="preload" href="./fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="./fonts/space-grotesk-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
<style>
@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:400;font-display:swap;src:url('./fonts/space-grotesk-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:500;font-display:swap;src:url('./fonts/space-grotesk-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:600;font-display:swap;src:url('./fonts/space-grotesk-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Space Grotesk';font-style:normal;font-weight:700;font-display:swap;src:url('./fonts/space-grotesk-latin-700-normal.woff2') format('woff2')}
@font-face{font-family:'Inter';font-style:normal;font-weight:400;font-display:swap;src:url('./fonts/inter-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Inter';font-style:normal;font-weight:500;font-display:swap;src:url('./fonts/inter-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Inter';font-style:normal;font-weight:600;font-display:swap;src:url('./fonts/inter-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Space Mono';font-style:normal;font-weight:400;font-display:swap;src:url('./fonts/space-mono-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Space Mono';font-style:normal;font-weight:700;font-display:swap;src:url('./fonts/space-mono-latin-700-normal.woff2') format('woff2')}
@font-face{font-family:'Comfortaa';font-style:normal;font-weight:400;font-display:swap;src:url('./fonts/comfortaa-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Comfortaa';font-style:normal;font-weight:500;font-display:swap;src:url('./fonts/comfortaa-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Comfortaa';font-style:normal;font-weight:600;font-display:swap;src:url('./fonts/comfortaa-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Comfortaa';font-style:normal;font-weight:700;font-display:swap;src:url('./fonts/comfortaa-latin-700-normal.woff2') format('woff2')}
</style>
<style>
:root{
  --paper:#FAFAF9; --ink:#0F0F0F; --line:#E8E8E5; --line-strong:#1A1A1A;
  --muted:#8A8A85; --card:#FFFFFF; --shell:#EFEFEC;
  --ease:cubic-bezier(.2,.7,.3,1); --bond:cubic-bezier(.76,0,.24,1);
  --d:'Space Grotesk',system-ui,sans-serif; --b:'Inter',system-ui,sans-serif; --m:'Space Mono','SF Mono',monospace;
  --logo:'Comfortaa','Space Grotesk',cursive;
}
body.dark{
  --paper:#1A1A1A; --ink:#F3F3F1; --line:#2C2C2C; --line-strong:#444341;
  --muted:#8C8C88; --card:#222221; --shell:#0E0E0E;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--shell);font-family:var(--b);color:var(--ink);display:grid;place-items:center;
  -webkit-font-smoothing:antialiased;transition:background .5s var(--ease),color .5s var(--ease)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
::selection{background:var(--ink);color:var(--paper)}
.mono{font-family:var(--m);font-size:.58rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}

.app{position:relative;width:100%;max-width:430px;height:100dvh;max-height:920px;background:var(--paper);
  overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 80px -30px rgba(0,0,0,.4);transition:background .5s var(--ease)}
@media(min-width:480px){.app{border-radius:30px;height:92dvh}}

/* ===== intro: multiplying circles -> rotate about center -> high-velocity scroll w/ motion blur -> wordmark ===== */
.intro{position:absolute;inset:0;z-index:200;background:#1A1A1A;overflow:hidden;display:grid;place-items:center;transition:background .5s var(--ease)}
.intro.done{display:none}
#introCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1}
.intro-lockup{position:relative;z-index:2;font-family:var(--logo);font-weight:500;font-size:2.7rem;letter-spacing:.01em;color:#F3F3F1;
  opacity:0;filter:blur(22px);transform:translateY(12px) scale(.97);
  transition:opacity .75s var(--ease),filter .75s var(--ease),transform .75s var(--ease);will-change:opacity,filter,transform}
.intro-lockup.in{opacity:1;filter:blur(0);transform:none}
.intro-skip{position:absolute;z-index:3;bottom:26px;left:50%;transform:translateX(-50%);font-family:var(--m);font-size:.56rem;
  letter-spacing:.18em;text-transform:uppercase;color:var(--muted);opacity:0;animation:introSkip .4s ease 1.4s forwards}
.intro.closing{animation:introFade .5s var(--ease) forwards}
@keyframes introSkip{to{opacity:1}}
@keyframes introFade{to{opacity:0}}

/* ===== top bar + daily completion ===== */
.topbar{flex:none;padding:calc(16px + env(safe-area-inset-top)) 20px 12px;border-bottom:1px solid var(--line);background:var(--paper);z-index:6;transition:background .5s var(--ease),border-color .5s}
.tb-row{display:flex;align-items:center;justify-content:space-between}
.wordmark{font-family:var(--logo);font-weight:500;font-size:1.34rem;letter-spacing:.005em;line-height:1}
.wordmark .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ink);margin-left:4px;vertical-align:baseline}
.icon-btn{width:36px;height:36px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;transition:.25s var(--bond)}
.icon-btn:active{transform:scale(.9)}
.icon-btn svg{width:17px;height:17px;stroke:var(--ink);stroke-width:1.6;fill:none}
.daily{margin-top:13px}
.daily .dl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.daily .dl .lab{font-family:var(--m);font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.daily .dl .pct{font-family:var(--d);font-weight:600;font-size:.92rem}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;width:0;background:var(--ink);border-radius:6px;transition:width .6s var(--bond)}

/* ===== views ===== */
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{width:0}
.view{display:none;animation:fade .35s var(--ease)}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.vhead{padding:24px 20px 6px}
.vhead .ix{font-family:var(--m);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.vhead h1{font-family:var(--d);font-weight:600;font-size:1.7rem;letter-spacing:-.02em;margin-top:10px}
.vhead p{color:var(--muted);font-size:.88rem;margin-top:7px;max-width:32ch}

/* ===== tasks grid (2-up pairs) ===== */
#taskGrid{position:relative;padding:16px 20px 120px;display:flex;flex-direction:column;gap:10px}
#taskGrid.splitting{display:grid;grid-template-columns:1fr 1fr}
.pair{display:flex;border:1px solid var(--line);background:var(--card);border-radius:16px;overflow:hidden;transition:border-color .25s}
.pair .tcard{flex:1;border:none;border-radius:0;background:transparent;box-shadow:none;min-height:104px}
.divider{width:1px;flex:none;background:var(--line);margin:14px 0;align-self:stretch}
.tcard{position:relative;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px 13px 13px;
  min-height:110px;display:flex;flex-direction:column;cursor:grab;overflow:hidden;
  transition:transform .3s var(--bond),border-color .25s,opacity .25s,box-shadow .25s}
.tcard:active{cursor:grabbing}
.tcard.ghost{opacity:.28}
.tcard.snap{border-color:var(--muted)}
.tcard .ix{font-family:var(--m);font-size:.56rem;letter-spacing:.1em;color:var(--muted)}
.tcard .tt{font-family:var(--d);font-weight:600;font-size:1.02rem;letter-spacing:-.01em;line-height:1.18;margin-top:auto;
  word-break:break-word;max-height:3.6em;overflow:hidden}
.tcard.done .tt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line-strong)}
.tcard .row{display:flex;align-items:center;justify-content:space-between;margin-top:11px}
.tcard .dot{width:23px;height:23px;border:1.6px solid var(--muted);border-radius:50%;display:grid;place-items:center;transition:.25s var(--bond)}
.tcard .dot.on{background:var(--ink);border-color:var(--ink)}
.tcard .dot svg{width:12px;height:12px;stroke:var(--paper);stroke-width:2.8;fill:none;opacity:0;transition:.2s}
.tcard .dot.on svg{opacity:1}
.tcard .del{font-family:var(--m);font-size:.54rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:5px 7px;border:1px solid var(--line);border-radius:20px}
.drag-clone{position:fixed;z-index:999;pointer-events:none;border:1px solid var(--line);background:var(--card);border-radius:16px;
  padding:14px 13px 13px;display:flex;flex-direction:column;box-shadow:0 22px 44px -16px rgba(0,0,0,.5);transform:scale(1.04);opacity:.96}
.pair-tag{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin:2px 2px -2px;opacity:.0;height:0}
.add-card{grid-column:1/-1;margin-top:2px;border:1px dashed var(--line-strong);border-radius:16px;padding:16px;display:flex;align-items:center;
  justify-content:center;gap:9px;font-family:var(--m);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);transition:.25s var(--bond)}
.add-card:active{transform:scale(.98)}
.add-card svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.8;fill:none}

/* ===== focus: pick circles + dial ===== */
/* ===== FOCUS: two color-matched task circles -> merge -> Apple-style clock ring ===== */
#focusWrap{padding:8px 20px 110px;min-height:64vh;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}

/* pick stage: two identical circles that breathe, then merge into one */
.pickStage{position:relative;width:100%;height:54vh;display:flex;align-items:center;justify-content:center}
.pickHead{position:absolute;top:2vh;left:0;right:0;text-align:center;transition:opacity .4s var(--ease)}
.fcircle{position:absolute;left:50%;top:50%;--w:min(44vw,176px);--off:calc(var(--w)/2 + 8px);--grow:1.55;
  width:var(--w);height:var(--w);border-radius:50%;
  border:1.5px solid var(--line);background-color:var(--card);display:grid;place-items:center;text-align:center;cursor:pointer;
  transform:translate(-50%,-50%);
  transition:transform 1.2s var(--bond),opacity 1.1s var(--ease),background-color 1s var(--ease),border-color 1s var(--ease)}
.fcircle .ft{font-family:var(--d);font-weight:600;font-size:clamp(.95rem,4.4vw,1.24rem);max-width:min(33vw,130px);letter-spacing:-.01em;line-height:1.22;color:var(--ink);transition:opacity .8s var(--ease),transform 1.2s var(--bond)}
.fcircle.left{animation:floatL 5.4s var(--ease) infinite}
.fcircle.right{animation:floatR 5.4s var(--ease) infinite}
.fcircle.solo{animation:floatS 5.4s var(--ease) infinite}
.fcircle.left:active,.fcircle.right:active,.fcircle.solo:active{animation-play-state:paused}
@keyframes floatL{0%,100%{transform:translate(-50%,-50%) translateX(calc(var(--off) * -1)) translateY(0) scale(1)}
  50%{transform:translate(-50%,-50%) translateX(calc(var(--off) * -1)) translateY(-7px) scale(1.02)}}
@keyframes floatR{0%,100%{transform:translate(-50%,-50%) translateX(var(--off)) translateY(0) scale(1)}
  50%{transform:translate(-50%,-50%) translateX(var(--off)) translateY(-7px) scale(1.02)}}
@keyframes floatS{0%,100%{transform:translate(-50%,-50%) translateY(0) scale(1)}
  50%{transform:translate(-50%,-50%) translateY(-7px) scale(1.02)}}
/* merge: chosen swells at center, the other slides in & is absorbed */
.fcircle.frozenL{animation:none;transform:translate(-50%,-50%) translateX(calc(var(--off) * -1))}
.fcircle.frozenR{animation:none;transform:translate(-50%,-50%) translateX(var(--off))}
.fcircle.frozenC{animation:none;transform:translate(-50%,-50%)}
.fcircle.keep{animation:none;z-index:2;background-color:transparent;border-color:transparent;transform:translate(-50%,-50%) scale(var(--grow))}
.fcircle.keep .ft{transform:scale(calc(1 / var(--grow)))}
.fcircle.absorb{animation:none;z-index:1;opacity:0;transform:translate(-50%,-50%) scale(.34)}

.pickHint{position:absolute;bottom:2vh;display:flex;align-items:center;gap:11px;opacity:0;transition:opacity .45s}
.pickHint.show{opacity:1}
.pill{border:1px solid var(--line);border-radius:30px;padding:10px 18px;font-family:var(--m);font-size:.6rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);background:var(--card);transition:.25s var(--bond)}
.pill:active{transform:scale(.93)}
.pill.solo-start{color:var(--ink);border-color:var(--ink)}

/* clock stage: Apple-style ring */
.dialStage{display:none;flex-direction:column;align-items:center;width:100%}
.dialStage.on{display:flex}
.dialTop{text-align:center;transition:opacity .5s var(--ease)}
.dialBottom{display:flex;flex-direction:column;align-items:center;transition:opacity .5s var(--ease)}
.dialMode{font-family:var(--m);font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.dialMeta{font-family:var(--d);font-weight:600;font-size:1.06rem;margin:0 0 22px;text-align:center;max-width:80vw;color:var(--ink);min-height:1.2em}
.traceTitle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--d);font-weight:600;
  font-size:clamp(.95rem,4.4vw,1.24rem);max-width:min(33vw,130px);text-align:center;letter-spacing:-.01em;line-height:1.22;color:var(--ink);pointer-events:none;transition:opacity .5s var(--ease)}
.face,#dlticks,.dl-track{transition:opacity .5s var(--ease)}
.dialStage.tracing .dialTop,.dialStage.tracing .dialBottom,.dialStage.tracing .face,.dialStage.tracing #dlticks,.dialStage.tracing .dl-track{opacity:0}
.dialStage:not(.tracing) .traceTitle{opacity:0}
#dial{position:relative;width:min(76vw,308px);height:min(76vw,308px);touch-action:none;cursor:grab}
#dial:active{cursor:grabbing}
#dial svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#dial .face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;pointer-events:none}
#dial .time{font-family:var(--d);font-weight:300;font-size:clamp(2.6rem,13.5vw,4rem);letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1}
#dial .hint{font-family:var(--m);font-size:.55rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.dl-track{fill:none;stroke:var(--ink);opacity:.07;stroke-width:2}
.dl-tick{stroke:var(--ink);stroke-linecap:round}
.dl-tick.maj{opacity:.32;stroke-width:1.2}
.dl-tick.min{opacity:.12;stroke-width:.8}
.dl-prog{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.dl-knob{fill:var(--ink)}
.presets{display:flex;gap:10px;margin-top:24px}
.preset{border:1px solid var(--line);border-radius:24px;padding:9px 16px;font-family:var(--m);font-size:.64rem;letter-spacing:.06em;
  color:var(--muted);background:var(--card);transition:.2s var(--bond)}
.preset:active{transform:scale(.92)}
.preset.on{color:var(--paper);background:var(--ink);border-color:var(--ink)}
.dialCtrls{display:flex;gap:36px;margin-top:24px}
.dialCtrls button{font-family:var(--m);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);transition:.2s var(--bond)}
.dialCtrls button:active{transform:scale(.9)}
/* ── focus completion: check-off + fade ── */
.checkoff{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  background:var(--paper);opacity:0;transform:scale(1);transition:opacity .4s var(--ease),transform .55s var(--ease)}
.checkoff.in{opacity:1}
.checkoff.out{opacity:0;transform:translateY(-14px) scale(.97)}
.checkoff .co-badge{width:94px;height:94px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;
  transform:scale(.55);opacity:0;transition:transform .5s var(--bond),opacity .35s var(--ease),background .35s var(--ease)}
.checkoff.in .co-badge{transform:scale(1);opacity:1}
.checkoff .co-badge.filled{background:var(--ink)}
.checkoff .co-badge svg{width:44px;height:44px;fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s var(--ease)}
.checkoff .co-badge.filled svg{stroke:var(--paper)}
.checkoff .co-badge svg path{stroke-dasharray:30;stroke-dashoffset:30;transition:stroke-dashoffset .45s cubic-bezier(.6,0,.3,1) .12s}
.checkoff .co-badge.filled svg path{stroke-dashoffset:0}
.checkoff .co-title{font-family:var(--d);font-weight:500;font-size:1.15rem;letter-spacing:-.01em;color:var(--ink);
  text-align:center;max-width:78%;line-height:1.3;opacity:0;transform:translateY(8px);transition:.45s var(--ease) .08s}
.checkoff.in .co-title{opacity:1;transform:none}
.checkoff .co-label{font-family:var(--m);font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  opacity:0;transition:.5s var(--ease) .16s}
.checkoff.in .co-label{opacity:.85}

/* empty states */
.cal-week-range{font-size:.58rem;letter-spacing:.1em;color:var(--muted);margin:-4px 0 14px;text-transform:uppercase}
/* ── completed section ── */
.done-section{margin:8px 0 0;padding:0}
.done-head{display:flex;align-items:center;justify-content:space-between;padding:18px 0 10px;border-top:1px solid var(--line)}
.done-head .mono{font-size:.62rem;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;font-family:var(--m)}
.done-count{font-family:var(--m);font-size:.62rem;color:var(--muted);background:var(--line);border-radius:20px;padding:3px 8px}
.done-row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);opacity:.6;transition:opacity .2s}
.done-row:hover{opacity:.85}
.done-dot{width:20px;height:20px;border-radius:50%;background:var(--ink);border:1.5px solid var(--ink);
  display:grid;place-items:center;flex:none;cursor:pointer;color:var(--paper);transition:.2s}
.done-dot svg{width:10px;height:10px}
.done-tt{flex:1;font-size:.9rem;font-family:var(--d);text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.done-del{font-size:1.1rem;color:var(--muted);cursor:pointer;padding:0 2px;transition:.2s}
.done-del:hover{color:var(--ink)}
#dayList{width:100%;margin-bottom:14px;max-height:200px;overflow-y:auto}
.ds-row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
.ds-row.done .ds-title{text-decoration:line-through;opacity:.4}
.ds-dot{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);flex:none;cursor:pointer;transition:.2s}
.ds-row.done .ds-dot{background:var(--ink);border-color:var(--ink)}
.ds-title{flex:1;font-size:.92rem;font-family:var(--d)}
.ds-del{font-size:1.1rem;color:var(--muted);cursor:pointer;padding:0 2px;transition:.2s}
.ds-del:hover{color:var(--ink)}
.ds-empty{font-size:.84rem;color:var(--muted);padding:10px 2px;font-family:var(--b)}
.focusEmpty{text-align:center}
.focusEmpty .mk{font-family:var(--m);font-size:1.5rem;border:1.5px solid var(--line);border-radius:50%;
  width:60px;height:60px;display:grid;place-items:center;margin:0 auto 18px;color:var(--ink)}
.focusEmpty h3{font-family:var(--d);font-weight:600;font-size:1.15rem;margin-bottom:6px;color:var(--ink)}
.focusEmpty p{color:var(--muted);font-size:.9rem;max-width:26ch;margin:0 auto;line-height:1.5}
.empty-tasks{padding:58px 30px;text-align:center;display:flex;flex-direction:column;align-items:center}
.empty-tasks h3{font-family:var(--d);font-weight:600;font-size:1.18rem;margin-bottom:8px}
.empty-tasks p{color:var(--muted);font-size:.9rem;max-width:25ch;line-height:1.5;margin-bottom:24px}
.empty-add{font-family:var(--m);font-size:.64rem;letter-spacing:.13em;text-transform:uppercase;border:1px solid var(--line-strong);border-radius:30px;padding:13px 26px;color:var(--ink);background:transparent;cursor:pointer;transition:transform .18s var(--bond),background .2s,color .2s}
.empty-add:hover{background:var(--ink);color:var(--paper)}
.empty-add:active{transform:scale(.96)}

/* ===== calendar ===== */
#calWrap{padding:18px 18px 120px}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 16px}
.cal-head .mo{font-family:var(--d);font-weight:600;font-size:1.25rem;letter-spacing:-.01em}
.cal-nav{display:flex;gap:8px}
.cal-nav button{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;transition:.2s var(--bond)}
.cal-nav button:active{transform:scale(.9)}
.cal-nav svg{width:15px;height:15px;stroke:var(--ink);stroke-width:1.8;fill:none}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:8px}
.cal-dow span{text-align:center;font-family:var(--m);font-size:.54rem;letter-spacing:.06em;color:var(--muted)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-cell{aspect-ratio:1;display:grid;place-items:center;position:relative;border-radius:12px;transition:background .2s}
.cal-cell.empty{visibility:hidden}
.cal-cell:active{background:var(--line)}
.cal-cell .ring{width:84%;height:84%}
.cal-cell .ring .ct{fill:none;stroke:var(--ink);opacity:.12;stroke-width:7}
.cal-cell .ring .cp{fill:none;stroke:var(--ink);stroke-width:7;stroke-linecap:round}
.cal-cell .dn{position:absolute;font-family:var(--m);font-size:.62rem;color:var(--muted)}
.cal-cell.today .dn{color:var(--ink);font-weight:700}
.cal-cell.today{box-shadow:inset 0 0 0 1.5px var(--line-strong)}
.cal-legend{display:flex;align-items:center;gap:14px;justify-content:center;margin-top:22px;font-family:var(--m);font-size:.55rem;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ===== bottom tabs ===== */
.tabbar{flex:none;display:flex;border-top:1px solid var(--line);background:var(--paper);padding-bottom:env(safe-area-inset-bottom);
  z-index:6;transition:background .5s var(--ease),border-color .5s}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 0 12px;color:var(--muted);transition:color .2s}
.tab.on{color:var(--ink)}
.tab svg{width:21px;height:21px;stroke:currentColor;stroke-width:1.7;fill:none}
.tab span{font-family:var(--m);font-size:.54rem;letter-spacing:.12em;text-transform:uppercase}
.tab .ind{width:4px;height:4px;border-radius:50%;background:var(--ink);opacity:0;transition:opacity .2s}
.tab.on .ind{opacity:1}

/* ===== add sheet ===== */
#scrim{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.45);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .35s}
#scrim.show{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--paper);border-radius:26px 26px 0 0;border-top:1px solid var(--line);
  padding:12px 20px calc(22px + env(safe-area-inset-bottom));transform:translateY(115%);transition:transform .5s var(--bond);box-shadow:0 -20px 50px -12px rgba(0,0,0,.4)}
#sheet.show{transform:none}
#sheet .grab{width:38px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 16px}
#sheet h3{font-family:var(--d);font-weight:600;font-size:1.25rem;margin-bottom:14px}
#sheet input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;font-size:16px;color:var(--ink);outline:none}
#sheet input:focus{border-color:var(--line-strong)}
#sheet .go{margin-top:13px;width:100%;padding:15px;border-radius:14px;background:var(--ink);color:var(--paper);font-family:var(--d);font-weight:600;font-size:1rem;transition:.2s var(--bond)}
#sheet .go:active{transform:scale(.98)}

.toast{position:absolute;bottom:88px;left:50%;transform:translateX(-50%) translateY(140%);z-index:40;background:var(--ink);color:var(--paper);
  opacity:0;pointer-events:none;
  padding:11px 20px;border-radius:30px;font-family:var(--m);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;transition:transform .45s var(--bond),opacity .3s var(--ease)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.note{position:absolute;top:calc(6px + env(safe-area-inset-top));left:0;right:0;text-align:center;font-family:var(--m);font-size:.5rem;
  letter-spacing:.12em;text-transform:uppercase;color:var(--muted);opacity:.5;z-index:50;pointer-events:none}
</style>
</head>
<body>
<div class="app">
  <div class="note">real-time · demo</div>

  <!-- top bar -->
  <div class="topbar">
    <div class="tb-row">
      <div class="wordmark">Haylo</div>
      <button class="icon-btn" onclick="toggleTheme()" aria-label="theme">
        <svg id="themeIcon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      </button>
    </div>
    <div class="daily">
      <div class="dl"><span class="lab" id="dailyLab">Today · 0/0</span><span class="pct" id="dailyPct">0%</span></div>
      <div class="bar"><div class="fill" id="dailyFill"></div></div>
    </div>
  </div>

  <div class="scroll">
    <!-- TASKS -->
    <section class="view on" id="v-tasks">
      <div class="vhead"><div class="ix">01 — Today</div><h1>Tasks</h1><p>Drag a card beside another to pair them. Each row is one pair.</p></div>
      <div id="taskGrid"></div>
    </section>

    <!-- FOCUS -->
    <section class="view" id="v-focus">
      <div class="vhead"><div class="ix">02 — Focus</div><h1>Focus</h1><p>Pick one from the pair. The circles merge into your session.</p></div>
      <div id="focusWrap"></div>
    </section>

    <!-- CALENDAR -->
    <section class="view" id="v-cal">
      <div class="vhead"><div class="ix">03 — Record</div><h1>Calendar</h1><p>Each ring shows that day's completion.</p></div>
      <div id="calWrap"></div>
    </section>
  </div>

  <!-- bottom tabs -->
  <nav class="tabbar">
    <button class="tab on" data-v="tasks" onclick="go('tasks')">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="8" height="7" rx="1.5"/><rect x="13" y="4" width="8" height="7" rx="1.5"/><rect x="3" y="14" width="8" height="6" rx="1.5"/><rect x="13" y="14" width="8" height="6" rx="1.5"/></svg>
      <span>Tasks</span><i class="ind"></i>
    </button>
    <button class="tab" data-v="focus" onclick="go('focus')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.4"/></svg>
      <span>Focus</span><i class="ind"></i>
    </button>
    <button class="tab" data-v="cal" onclick="go('cal')">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="16" rx="2.5"/><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3"/></svg>
      <span>Calendar</span><i class="ind"></i>
    </button>
  </nav>

  <!-- add sheet -->
  <div id="scrim" onclick="closeSheet()"></div>
  <div id="sheet">
    <div class="grab"></div><h3>New task</h3>
    <input id="taskInput" placeholder="What needs doing?" autocomplete="off"/>
    <button class="go" onclick="addTask()">Add task</button>
  </div>

  <div class="toast" id="toast"></div>

  <!-- intro -->
  <div class="intro" id="intro">
    <canvas id="introCanvas"></canvas>
    <div class="intro-lockup" id="introWord">Haylo</div>
    <div class="intro-skip">Tap to skip</div>
  </div>
</div>

<script>
/* ============ state ============ */
let nextId=4;
let sheetDate=null;   // which day's sheet is open (null = "today" / add-task from Tasks tab)
let TASKS=[{id:1,t:'Write project brief',done:false,dueDate:keyOf(new Date())},{id:2,t:'Read 20 pages',done:false,dueDate:keyOf(new Date())},{id:3,t:'Inbox zero',done:false,dueDate:keyOf(new Date())}];
let view='tasks';
const todayKey=keyOf(new Date());
let HISTORY=seedHistory();
let calCursor={y:new Date().getFullYear(), m:new Date().getMonth()};

/* focus / pick */
let pairStart=0, pickSplit=true, pickChosen=null;
/* timer */
const LAP=60, TICKS=8;
let timer={mode:'focus',run:'setup',setMin:30,total:30*60,remaining:30*60,endAt:0,taskId:null,taskTitle:null,sessions:0};
let ticker=null;
let traceIntro=false;
const C=2*Math.PI*44, CC=2*Math.PI*13;

/* ============ persistence (web build) ============
   The Android build kept everything in memory. On the web a refresh would wipe
   it, so all durable state lives in localStorage under one key. */
const STORE_KEY='haylo.v1';
const INTRO_ONCE_PER_DAY=true;   // set false to play the full intro on every load

function saveState(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify({
      v:1, nextId, TASKS, HISTORY,
      sessions: timer.sessions,
      setMin: timer.setMin,
      dark: document.body.classList.contains('dark'),
      savedAt: Date.now()
    }));
  }catch(e){ /* private mode / quota — app still runs, just won't persist */ }
}
let _saveT=null;
function saveSoon(){ clearTimeout(_saveT); _saveT=setTimeout(saveState,250); }

function loadState(){
  let raw=null;
  try{ raw=localStorage.getItem(STORE_KEY); }catch(e){ return false; }
  if(!raw) return false;
  try{
    const d=JSON.parse(raw);
    if(Array.isArray(d.TASKS)){
      TASKS=d.TASKS.filter(x=>x && typeof x.t==='string')
                   .map(x=>({id:+x.id, t:String(x.t), done:!!x.done, dueDate:x.dueDate||todayKey}));
    }
    if(d.HISTORY && typeof d.HISTORY==='object') HISTORY=d.HISTORY;
    const maxId=TASKS.reduce((m,x)=>Math.max(m,x.id||0),0);
    nextId=Math.max(+d.nextId||1, maxId+1);
    if(Number.isFinite(+d.sessions)) timer.sessions=+d.sessions;
    if(Number.isFinite(+d.setMin) && d.setMin>0){
      timer.setMin=+d.setMin; timer.total=timer.setMin*60; timer.remaining=timer.total;
    }
    return true;
  }catch(e){ return false; }
}

function applyTheme(dark){
  document.body.classList.toggle('dark', !!dark);
  const ic=document.getElementById('themeIcon');
  if(ic) ic.innerHTML = dark
    ? '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/>'
    : '<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/>';
  const mc=document.getElementById('themeColor');
  if(mc) mc.setAttribute('content', dark?'#0E0E0E':'#EFEFEC');
}

const HAD_SAVE=loadState();
(function initTheme(){
  let dark=null;
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(raw) dark=!!JSON.parse(raw).dark;
  }catch(e){}
  if(dark===null && window.matchMedia)
    dark=matchMedia('(prefers-color-scheme: dark)').matches;   // first visit: follow the OS
  applyTheme(dark);
})();

/* Wipe everything — exposed for the console and for a future settings screen. */
function resetHaylo(){
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  location.reload();
}

/* ============ helpers ============ */
function keyOf(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function seedHistory(){ return {}; }   // blank — real data fills in as users complete tasks
function pending(){return TASKS.filter(x=>!x.done && (!x.dueDate || x.dueDate===todayKey));}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1900);}
function clock(sec){sec=Math.max(0,Math.ceil(sec));const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;
  return h>0?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`;}

/* ============ intro ============ */
(function(){
  const el=document.getElementById('intro');
  const cv=document.getElementById('introCanvas');
  const word=document.getElementById('introWord');
  const ctx=cv.getContext('2d');
  let done=false, raf=0, running=true, t0=null, last=null, scrollOff=0, vel=0;

  const csv=getComputedStyle(document.documentElement);
  const BG='#1A1A1A';   // dark-mode charcoal
  const FG='#F3F3F1';   // dark-mode soft-white

  let W=0,H=0,DPR=1,cx=0,cy=0,pitch=100,R=36;
  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2.5);
    W=el.clientWidth||window.innerWidth; H=el.clientHeight||window.innerHeight;
    cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    cx=W/2; cy=H/2; R=Math.min(W,H)*0.30; pitch=R*2.05;   // circles ~3/5 of frame width
  }
  resize(); window.addEventListener('resize',resize);

  const N=50, HALF=25;
  const cl=x=>x<0?0:x>1?1:x;
  const eiCubic=x=>x*x*x;
  const eioQuint=x=>x<.5?16*x*x*x*x*x:1-Math.pow(-2*x+2,5)/2;
  const eoBack=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};

  // timeline (ms): multiply -> rotate about center -> accelerate scroll (blur) -> dissolve into wordmark
  const DUP_END=900, ROT_S=780, ROT_E=1620, SCR_S=1620, SCR_PEAK=2500, LOGO_S=2250, LOGO_E=3150, ENDT=4500, VMAX=58;

  function wrap(v,m){v%=m; if(v<0)v+=m; return v;}
  function rgba(hex,a){hex=hex.replace('#','');if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');
    return 'rgba('+parseInt(hex.slice(0,2),16)+','+parseInt(hex.slice(2,4),16)+','+parseInt(hex.slice(4,6),16)+','+a+')';}

  function frame(ts){
    if(!running)return;
    if(t0==null){t0=ts;last=ts;}
    const t=ts-t0, dt=Math.min(40,ts-last); last=ts;

    // rotation of the row about its center circle: 0 -> 90deg with momentum
    const rotP=eioQuint(cl((t-ROT_S)/(ROT_E-ROT_S)));
    const theta=rotP*Math.PI/2, ct=Math.cos(theta), st=Math.sin(theta);

    // scroll velocity ramps up (accelerates) -> true high velocity
    const velN=eiCubic(cl((t-SCR_S)/(SCR_PEAK-SCR_S)));
    vel=velN*VMAX;
    if(t>=SCR_S) scrollOff+=vel*(dt/16.67);

    // motion blur = frame persistence; faster motion -> longer trails. crisp at low velocity.
    const blur=cl(vel/(VMAX*0.42));
    const clearA=1-blur*0.8;                          // 1 = full clear (crisp) ... 0.2 = trails
    ctx.globalAlpha=1; ctx.fillStyle=rgba(BG,clearA); ctx.fillRect(0,0,W,H);

    const cAlpha=1-cl((t-LOGO_S)/(LOGO_E-LOGO_S));     // circles dissolve as the logo resolves
    const Hcol=N*pitch;
    ctx.fillStyle=FG;
    if(cAlpha>0){
      for(let k=-HALF;k<N-HALF;k++){
        const appearT=(Math.abs(k)/HALF)*(DUP_END-160);  // cascade outward from center
        const age=t-appearT; if(age<0) continue;
        const s=Math.max(0,eoBack(cl(age/240)));         // pop-in with overshoot
        const base=k*pitch;
        let X,Y;
        if(t<ROT_E){ X=cx+base*ct; Y=cy+base*st; }       // horizontal row -> rotating
        else{ X=cx; Y=cy+(wrap(base+scrollOff+Hcol/2,Hcol)-Hcol/2); } // vertical, endless scroll
        if(X<-R*3||X>W+R*3||Y<-R*3||Y>H+R*3) continue;   // cull offscreen (most of the 50)
        ctx.globalAlpha=cAlpha;
        ctx.beginPath(); ctx.arc(X,Y,R*s,0,6.2832); ctx.fill();
      }
    }
    ctx.globalAlpha=1;

    if(t>=LOGO_S) word.classList.add('in');
    if(t>=ENDT){ fin(); return; }
    raf=requestAnimationFrame(frame);
  }

  function fin(){
    if(done)return; done=true; running=false; if(raf)cancelAnimationFrame(raf);
    word.classList.add('in'); el.classList.add('closing');
    setTimeout(()=>el.classList.add('done'),520);
  }

  let seenToday=false;
  try{ seenToday = INTRO_ONCE_PER_DAY && localStorage.getItem('haylo.intro')===todayKey; }catch(e){}
  try{ localStorage.setItem('haylo.intro', todayKey); }catch(e){}

  if(seenToday){
    el.classList.add('done');            // already watched it today — go straight in
  } else if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){
    word.classList.add('in'); setTimeout(fin,900);
  } else { raf=requestAnimationFrame(frame); }

  el.addEventListener('click',()=>{ if(done)return;
    running=false; if(raf)cancelAnimationFrame(raf);
    ctx.fillStyle=BG; ctx.fillRect(0,0,W,H); word.classList.add('in'); setTimeout(fin,300);
  });
})();

/* ============ theme ============ */
function toggleTheme(){
  applyTheme(!document.body.classList.contains('dark'));
  saveSoon();
}

/* ============ nav ============ */
function go(v){
  view=v;
  document.querySelectorAll('.view').forEach(s=>s.classList.remove('on'));
  document.getElementById('v-'+v).classList.add('on');
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===v));
  document.querySelector('.scroll').scrollTop=0;
  if(v==='focus') renderFocus();
  if(v==='cal') renderCal();
  renderDaily();
}

/* ============ top progress bar (context-aware) ============ */
function renderDaily(){
  // always compute + persist today's record (feeds calendar rings + weekly sum)
  const todayAll = TASKS.filter(x=> !x.dueDate || x.dueDate===todayKey);
  const dDone=todayAll.filter(x=>x.done).length, dTotal=todayAll.length;
  HISTORY[todayKey]={done:dDone,total:dTotal};
  // show weekly on the Calendar tab, today everywhere else
  let lab,done,total,pct;
  if(view==='cal'){
    const w=weekProgressPct(); lab='Weekly'; done=w.done; total=w.total; pct=w.pct;
  } else {
    lab='Today'; done=dDone; total=dTotal; pct=dTotal?Math.round(dDone/dTotal*100):0;
  }
  document.getElementById('dailyLab').textContent=`${lab} · ${done}/${total}`;
  document.getElementById('dailyPct').textContent=pct+'%';
  document.getElementById('dailyFill').style.width=pct+'%';
}

/* ============ TASKS grid + drag pairing ============ */
function makeCard(x,i,half){
  const el=document.createElement('div'); el.className='tcard'+(half?' half':' solo')+(x.done?' done':''); el.dataset.id=x.id;
  el.innerHTML=`<div class="ix">${String(i+1).padStart(2,'0')}</div>
    <div class="tt">${escapeHtml(x.t)}</div>
    <div class="row">
      <div class="dot${x.done?' on':''}"><svg viewBox="0 0 24 24"><path d="M5 13l4 4 10-11"/></svg></div>
      <button class="del">Del</button>
    </div>`;
  el.querySelector('.dot').addEventListener('pointerdown',e=>e.stopPropagation());
  el.querySelector('.dot').addEventListener('click',e=>{e.stopPropagation();x.done=!x.done;renderTasks();renderDaily();});
  el.querySelector('.del').addEventListener('pointerdown',e=>e.stopPropagation());
  el.querySelector('.del').addEventListener('click',e=>{e.stopPropagation();TASKS=TASKS.filter(y=>y.id!==x.id);renderTasks();renderDaily();});
  attachCardDrag(el,x.id);
  return el;
}
function renderTasks(){
  const g=document.getElementById('taskGrid'); g.innerHTML='';
  g.classList.toggle('splitting', splitView);
  const todayTasks  = TASKS.filter(x=> (!x.dueDate || x.dueDate===todayKey) && !x.done);
  const doneTasks   = TASKS.filter(x=> (!x.dueDate || x.dueDate===todayKey) &&  x.done);

  if(!splitView && todayTasks.length===0 && doneTasks.length===0){
    const e=document.createElement('div'); e.className='empty-tasks';
    e.innerHTML='<h3>No tasks today</h3><p>Add your first task to begin, or tap a future date on the Calendar.</p><button class="empty-add" onclick="openSheet(null)">Add task</button>';
    g.appendChild(e); return;
  }

  if(splitView){
    todayTasks.forEach((x,i)=> g.appendChild(makeCard(x,i,false)));
  } else {
    for(let i=0;i<todayTasks.length;i+=2){
      const a=todayTasks[i], b=todayTasks[i+1];
      if(b){
        const pair=document.createElement('div'); pair.className='pair';
        pair.appendChild(makeCard(a,i,true));
        const dv=document.createElement('div'); dv.className='divider'; pair.appendChild(dv);
        pair.appendChild(makeCard(b,i+1,true));
        g.appendChild(pair);
      } else {
        g.appendChild(makeCard(a,i,false));
      }
    }
  }

  const add=document.createElement('button'); add.className='add-card'; add.onclick=()=>openSheet(null);
  add.innerHTML='Add task';
  g.appendChild(add);

  // ── Completed section ──────────────────────────────────────────
  if(doneTasks.length>0){
    const sec=document.createElement('div'); sec.className='done-section';
    const hd=document.createElement('div'); hd.className='done-head';
    hd.innerHTML=`<span class="mono">Completed</span><span class="done-count">${doneTasks.length}</span>`;
    sec.appendChild(hd);
    doneTasks.forEach((x,i)=>{
      const row=document.createElement('div'); row.className='done-row';
      row.innerHTML=`
        <span class="done-dot on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 13l4 4 10-11"/></svg></span>
        <span class="done-tt">${escapeHtml(x.t)}</span>
        <span class="done-del" onclick="TASKS=TASKS.filter(y=>y.id!==${x.id});renderTasks();renderDaily()">×</span>`;
      // tap checkmark to un-complete
      row.querySelector('.done-dot').addEventListener('click',e=>{
        e.stopPropagation(); x.done=false; renderTasks(); renderDaily();
      });
      sec.appendChild(row);
    });
    g.appendChild(sec);
  }
}
function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

let drag=null, splitView=false;
function attachCardDrag(el,id){
  el.addEventListener('pointerdown',e=>{
    if(e.target.closest('.dot')||e.target.closest('.del')) return;
    e.preventDefault();
    const sx=e.clientX, sy=e.clientY; let started=false;
    function move(ev){
      if(!started){
        if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<6) return;   // wait for a real drag (not a tap)
        started=true; startDrag(id,ev); return;                  // split all pairs into boxes
      }
      if(drag){ drag.lastEv=ev; scheduleFrame(); }
    }
    function up(){
      window.removeEventListener('pointermove',move);
      window.removeEventListener('pointerup',up);
      if(started) endDrag();                                     // release -> combine back into one card
    }
    window.addEventListener('pointermove',move,{passive:false});
    window.addEventListener('pointerup',up);
  });
}
function cacheCenters(){
  return [...document.querySelectorAll('#taskGrid .tcard')].map(c=>{
    const r=c.getBoundingClientRect(); return {id:c.dataset.id, el:c, cx:r.left+r.width/2, cy:r.top+r.height/2};
  });
}
function startDrag(id,ev){
  splitView=true; renderTasks();
  const g=document.getElementById('taskGrid');
  const el=g.querySelector(`.tcard[data-id="${id}"]`); if(!el){ splitView=false; renderTasks(); return; }
  const r=el.getBoundingClientRect();
  const clone=el.cloneNode(true); clone.classList.remove('ghost'); clone.classList.add('drag-clone');
  clone.style.width=r.width+'px'; clone.style.height=r.height+'px'; clone.style.left='0'; clone.style.top='0';
  clone.style.transform=`translate(${r.left}px,${r.top}px) scale(1.03)`;
  document.body.appendChild(clone);
  el.classList.add('ghost');
  drag={id, clone, offX:ev.clientX-r.left, offY:ev.clientY-r.top, lastEv:ev, raf:0, target:null, centers:cacheCenters()};
  scheduleFrame();
}
function scheduleFrame(){ if(drag && !drag.raf) drag.raf=requestAnimationFrame(frame); }
function frame(){
  if(!drag) return; drag.raf=0;
  const ev=drag.lastEv;
  drag.clone.style.transform=`translate(${ev.clientX-drag.offX}px,${ev.clientY-drag.offY}px) scale(1.03)`;
  let target=null,best=Infinity;
  for(const c of drag.centers){ if(c.id==drag.id)continue;
    const d=Math.hypot(ev.clientX-c.cx, ev.clientY-c.cy); if(d<best){best=d;target=c;} }
  drag.centers.forEach(c=>c.el.classList.remove('snap'));
  if(!target||best>200){ drag.target=null; return; }
  target.el.classList.add('snap');
  drag.target=target.id;            // mark swap target; cards do NOT shift during drag
}
function endDrag(){
  if(drag){
    drag.clone.remove(); if(drag.raf)cancelAnimationFrame(drag.raf);
    if(drag.target!=null && drag.target!=drag.id){          // swap dragged card with target only
      const from=TASKS.findIndex(x=>x.id==drag.id), to=TASKS.findIndex(x=>x.id==drag.target);
      if(from>-1 && to>-1){ const t=TASKS[from]; TASKS[from]=TASKS[to]; TASKS[to]=t; }
    }
  }
  splitView=false; drag=null; renderTasks(); renderDaily();
}

/* ============ FOCUS: pick circles + dial ============ */
function curPair(){
  const p=pending(); if(p.length===0)return[null,null];
  if(p.length===1)return[p[0],null];
  const s=((pairStart%p.length)+p.length)%p.length;
  return[p[s],p[(s+1)%p.length]];
}
function renderFocus(){
  const wrap=document.getElementById('focusWrap');

      : `<div class="focusEmpty"><div class="mk">✓</div><h3>All clear</h3><p>Every task is done. Enjoy the quiet.</p></div>`;

function shufflePair(){ pairStart++; renderFocus(); }
function chooseFocus(which){
  const [a,b]=curPair(); const task = which===0?a:b; if(!task)return;
  const fc1=document.getElementById('fc1'), fc2=document.getElementById('fc2');

  }

    keep.className='fcircle keep';
    if(absorb) absorb.className='fcircle absorb';
  });
  setTimeout(()=>beginFocus(task),1250);        // join done -> hand off; choice text persists into the trace
}
function beginFocus(task){
  timer.mode='focus'; timer.run='setup'; timer.taskId=task.id; timer.taskTitle=task.t;
  timer.setMin=30; timer.total=30*60; timer.remaining=30*60;
  traceIntro=true;
  renderFocus();
}
function renderDialStage(wrap){
  const doTrace=traceIntro; traceIntro=false;
  wrap.innerHTML=`
    <div class="dialStage on${doTrace?' tracing':''}">

  const g=document.getElementById('dlticks');

    const ri=maj?41:42.5, ro=45;
    const x1=50+ri*Math.cos(ang),y1=50+ri*Math.sin(ang),x2=50+ro*Math.cos(ang),y2=50+ro*Math.sin(ang);
    const ln=document.createElementNS('http://www.w3.org/2000/svg','line');
    ln.setAttribute('x1',x1.toFixed(2));ln.setAttribute('y1',y1.toFixed(2));ln.setAttribute('x2',x2.toFixed(2));ln.setAttribute('y2',y2.toFixed(2));
    ln.setAttribute('class','dl-tick '+(maj?'maj':'min')); g.appendChild(ln); }
  bindDial();
  // app-only: when running inside the Android wrapper, add a control to verify the lock-screen popup
  if(window.Android && typeof window.Android.scheduleLockPopup==='function'){
    const ctrls=document.querySelector('.dialCtrls');
    if(ctrls && !ctrls.querySelector('.lock-test')){
      const b=document.createElement('button'); b.className='lock-test'; b.textContent='Lock test';

/* the choice circle's outline is traced as a black line, then resolves into the clock */
function runTrace(){
  const stage=document.querySelector('.dialStage');
  const prog=document.getElementById('dlprog'); if(!prog)return;
  prog.style.transition='none'; prog.setAttribute('stroke-dashoffset',C);   // start: empty ring
  requestAnimationFrame(()=>requestAnimationFrame(()=>{                       // trace the full outline ~0.75s
    prog.style.transition='stroke-dashoffset .75s cubic-bezier(.6,0,.3,1)';
    prog.setAttribute('stroke-dashoffset','0');
  }));
  setTimeout(()=>{                                                            // resolve into the clock
    if(stage) stage.classList.remove('tracing');     // fade in clock content, dissolve the choice text
    prog.style.transition='stroke-dashoffset .5s var(--ease)';
    renderDial();                                     // retract the ring to the set time + show time/knob
    setTimeout(()=>{ const p=document.getElementById('dlprog'); if(p)p.style.transition='none'; },560);
  },820);
}
function renderDial(){
  const prog=document.getElementById('dlprog'), knob=document.getElementById('dlknob'); if(!prog)return;
  const setup = timer.run==='setup';
  const frac = setup ? timer.setMin/60 : (timer.total>0?timer.remaining/timer.total:0);
  prog.setAttribute('stroke-dashoffset',(C*(1-frac)).toFixed(2));
  const ang=(-90+360*frac)*Math.PI/180;
  knob.setAttribute('cx',(50+44*Math.cos(ang)).toFixed(2));
  knob.setAttribute('cy',(50+44*Math.sin(ang)).toFixed(2));
  knob.setAttribute('opacity', frac>0.004?1:0);
  knob.style.filter = 'none';
  document.getElementById('dltime').textContent = clock(setup?timer.setMin*60:timer.remaining);
  document.getElementById('dlhint').textContent = setup?'drag to set · tap to start':(timer.run==='running'?'tap to pause':'tap to resume');
  document.getElementById('dialMode').textContent = timer.mode==='focus'?'Focus':(timer.mode==='long'?'Long break':'Short break');
  document.getElementById('dialMeta').textContent = timer.mode==='focus'?(timer.taskTitle||''):'Rest your eyes';
  const pr=document.getElementById('presets');
  if(pr){ pr.style.display=(setup&&timer.mode==='focus')?'flex':'none';
    pr.querySelectorAll('.preset').forEach(b=>b.classList.toggle('on',+b.dataset.min===timer.setMin)); }
}
function bindDial(){
  const dial=document.getElementById('dial'); let down=null,dragging=false;
  dial.addEventListener('pointerdown',e=>{ dial.setPointerCapture(e.pointerId); down=[e.clientX,e.clientY]; dragging=false; });
  dial.addEventListener('pointermove',e=>{
    if(!down)return;
    if(Math.hypot(e.clientX-down[0],e.clientY-down[1])>5)dragging=true;
    if(dragging && timer.run==='setup') setFromAngle(e);
  });
  dial.addEventListener('pointerup',()=>{ if(!dragging)dToggle(); down=null; });
  dial.addEventListener('pointercancel',()=>{ down=null; });
}
function setFromAngle(e){
  const dial=document.getElementById('dial'); const r=dial.getBoundingClientRect();
  const dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height/2);
  let deg=Math.atan2(dx,-dy)*180/Math.PI; if(deg<0)deg+=360;   // 0 at top, clockwise
  let min=Math.round(deg/360*60/5)*5;                          // snap to 5-min steps
  if(min<5)min=5; if(min>60)min=60;
  timer.setMin=min; timer.total=min*60; timer.remaining=min*60; renderDial();
}
function setPreset(min){
  if(timer.run!=='setup')return;
  timer.setMin=min; timer.total=min*60; timer.remaining=min*60; renderDial();
}
function dToggle(){ if(timer.run==='setup'||timer.run==='paused')dStart(); else dPause(); }
function lockLabel(){ return timer.mode==='focus' ? (timer.taskTitle||'Focus') : 'Break over'; }
function armLock(){ try{ if(window.Android && Android.scheduleLockPopup) Android.scheduleLockPopup(timer.remaining, lockLabel()); }catch(e){} }
function disarmLock(){ try{ if(window.Android && Android.cancelLockPopup) Android.cancelLockPopup(); }catch(e){} }
function remainingNow(){ return Math.max(0, Math.round((timer.endAt - Date.now())/1000)); }
function startTicking(){
  const p0=document.getElementById('dlprog'); if(p0)p0.style.transition='none';
  timer.endAt = Date.now() + timer.remaining*1000;   // real-time target
  timer.run='running'; renderDial(); armLock();
  clearInterval(ticker); ticker=setInterval(tick,250);
}
function tick(){
  timer.remaining = remainingNow(); renderDial();
  if(timer.remaining<=0){ clearInterval(ticker); dComplete(false); }
}
function dStart(){ if(timer.run==='setup')timer.remaining=timer.total; startTicking(); }
function dPause(){ timer.remaining=remainingNow(); timer.run='paused'; clearInterval(ticker); disarmLock(); renderDial(); }
function dReset(){ clearInterval(ticker); disarmLock(); timer.run='setup'; timer.remaining=timer.total; renderDial(); }
function dSkip(){ clearInterval(ticker); disarmLock(); dComplete(true); }
function dExit(){
  clearInterval(ticker); disarmLock();
  if(timer.mode==='focus' && timer.taskId!=null){
    const title=timer.taskTitle||'';
    const t=TASKS.find(x=>x.id===timer.taskId);
    if(t) t.done=true;             // auto check-off on forced end
    renderDaily();
    timer.run='setup';
    playCheckoff(title, ()=>{ timer.taskId=null; renderFocus(); });   // check-off + fade, then pick
  } else {
    timer.run='setup'; timer.taskId=null; renderFocus();              // exiting a break: just leave
  }
}
function dComplete(skipped){
  clearInterval(ticker);
  if(timer.mode==='focus'){
    if(!skipped){
      timer.sessions++;
      const title=timer.taskTitle||'';
      const t=TASKS.find(x=>x.id===timer.taskId);
      if(t) t.done=true;             // auto check-off
      renderDaily();
      playCheckoff(title, startBreak);   // check-off + fade animation, then break
    } else {
      startBreak();                  // Skip: straight to break, task stays pending
    }
  } else {
    timer.mode='focus'; timer.run='setup'; timer.taskId=null; renderFocus();
    toast('Break done');
  }
}
function startBreak(){
  const isLong=timer.sessions>0 && timer.sessions%4===0;
  timer.mode=isLong?'long':'short'; const bm=isLong?15:5;
  timer.total=bm*60; timer.remaining=bm*60;
  startTicking();
}
/* completion overlay: the badge checks itself, the title fades, the whole card lifts away */
function playCheckoff(title, cb){
  const wrap=document.getElementById('focusWrap'); if(!wrap){ if(typeof cb==='function')cb(); return; }
  const ov=document.createElement('div'); ov.className='checkoff';
  ov.innerHTML=`<div class="co-badge" id="coBadge"><svg viewBox="0 0 24 24"><path d="M5 13l4 4 10-11"/></svg></div>
    <div class="co-title">${escapeHtml(title||'Focus session')}</div>
    <div class="co-label">Completed</div>`;
  wrap.appendChild(ov);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    ov.classList.add('in');
    const b=document.getElementById('coBadge'); if(b) setTimeout(()=>b.classList.add('filled'),200);
  }));
  setTimeout(()=>ov.classList.add('out'),1150);                 // hold, then fade + lift
  setTimeout(()=>{ ov.remove(); if(typeof cb==='function')cb(); },1720);
}

/* ============ CALENDAR ============ */
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function weekRange(){
  // Mon-start week containing today
  const now=new Date(); const dow=now.getDay(); // 0=Sun
  const diffToMon=dow===0?-6:1-dow;
  const mon=new Date(now); mon.setDate(now.getDate()+diffToMon);
  const sun=new Date(mon); sun.setDate(mon.getDate()+6);
  return {mon,sun};
}
function weekProgressPct(){
  const {mon,sun}=weekRange();
  const monKey=keyOf(mon), sunKey=keyOf(sun);
  // sum tasks across the week from TASKS + HISTORY
  let done=0,total=0;
  // TASKS (live data)
  TASKS.forEach(x=>{
    const dk=x.dueDate||todayKey;
    if(dk>=monKey && dk<=sunKey){ total++; if(x.done)done++; }
  });
  // HISTORY (past completed days not in TASKS)
  Object.entries(HISTORY).forEach(([k,v])=>{
    if(k>=monKey && k<=sunKey && k!==todayKey){
      // avoid double-counting days that are still in TASKS
      const alreadyCounted=TASKS.some(x=>(x.dueDate||todayKey)===k);
      if(!alreadyCounted){ done+=v.done; total+=v.total; }
    }
  });
  return {done,total,pct:total?Math.round(done/total*100):0};
}
function renderCal(){
  const {y,m}=calCursor; const wrap=document.getElementById('calWrap');
  const first=new Date(y,m,1).getDay(); const days=new Date(y,m+1,0).getDate();
  let cells='';
  for(let i=0;i<first;i++)cells+=`<div class="cal-cell empty"></div>`;
  for(let d=1;d<=days;d++){
    const k=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const rec=HISTORY[k]; const frac=rec&&rec.total?rec.done/rec.total:0;
    const off=CC*(1-frac);
    const isToday=(k===todayKey);
    cells+=`<button class="cal-cell${isToday?' today':''}" onclick="openDaySheet('${k}')">
      <svg class="ring" viewBox="0 0 36 36"><circle class="ct" cx="18" cy="18" r="13"/>
      <circle class="cp" cx="18" cy="18" r="13" transform="rotate(-90 18 18)" stroke-dasharray="${CC.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}"/></svg>
      <span class="dn">${d}</span></button>`;
  }
  const {mon,sun}=weekRange();
  const wLabel=`${MONTHS[mon.getMonth()].slice(0,3)} ${mon.getDate()} – ${MONTHS[sun.getMonth()].slice(0,3)} ${sun.getDate()}`;
  wrap.innerHTML=`
    <div class="cal-head">
      <div class="mo">${MONTHS[m]} ${y}</div>
      <div class="cal-nav">
        <button onclick="calMove(-1)"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button onclick="calMove(1)"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
    </div>
    <div class="cal-week-range mono">${wLabel}</div>
    <div class="cal-dow"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
    <div class="cal-grid">${cells}</div>
    <div class="cal-legend"><span>○ empty</span><span>◐ partial</span><span>● complete</span></div>`;
}
function calMove(d){ let m=calCursor.m+d,y=calCursor.y; if(m<0){m=11;y--;}if(m>11){m=0;y++;} calCursor={y,m}; renderCal(); }
function openDaySheet(k){
  const dayTasks=TASKS.filter(x=>x.dueDate===k);
  const isToday=(k===todayKey); const isPast=(k<todayKey);
  const label = isToday ? 'Today' : k;
  const items = dayTasks.length ? dayTasks.map(x=>`
    <div class="ds-row${x.done?' done':''}">
      <span class="ds-dot" onclick="toggleDayTask(${x.id},'${k}')"></span>
      <span class="ds-title">${escapeHtml(x.t)}</span>
      <span class="ds-del" onclick="deleteDayTask(${x.id},'${k}')">×</span>
    </div>`).join('')
    : `<div class="ds-empty">${isPast?'No tasks were logged.':'Nothing scheduled.'}</div>`;
  document.querySelector('#sheet h3').textContent = label;
  document.getElementById('sheet').dataset.dayKey = k;
  document.getElementById('taskInput').value='';
  // swap the "Add task" button to add for this date
  document.querySelector('#sheet .go').onclick = ()=>addTaskForDay(k);
  document.querySelector('#sheet .go').textContent = 'Add task';
  // inject task list above input
  let dl=document.getElementById('dayList');
  if(!dl){ dl=document.createElement('div'); dl.id='dayList'; document.getElementById('sheet').insertBefore(dl, document.getElementById('taskInput')); }
  dl.innerHTML=items;
  document.getElementById('scrim').classList.add('show');
  document.getElementById('sheet').classList.add('show');
}
function addTaskForDay(k){
  const v=document.getElementById('taskInput').value.trim();
  if(v){ TASKS.push({id:nextId++,t:v,done:false,dueDate:k}); renderTasks(); renderDaily(); }
  // refresh the day list inside the sheet
  openDaySheet(k); document.getElementById('taskInput').value='';
}
function toggleDayTask(id,k){ const t=TASKS.find(x=>x.id===id); if(t){t.done=!t.done;} renderTasks();renderDaily();openDaySheet(k); }
function deleteDayTask(id,k){ TASKS=TASKS.filter(x=>x.id!==id); renderTasks();renderDaily();openDaySheet(k); }

/* ============ autosave wiring ============
   Every mutation in this app ends in one of these renders, so wrapping them
   catches all of them without touching each call site. */
['renderTasks','renderDaily','renderCal','renderFocus'].forEach(fn=>{
  const orig=window[fn];
  if(typeof orig!=='function') return;
  window[fn]=function(){ const r=orig.apply(this,arguments); saveSoon(); return r; };
});
document.addEventListener('visibilitychange',()=>{ if(document.hidden) saveState(); });
window.addEventListener('pagehide', saveState);
window.addEventListener('beforeunload', saveState);

/* ============ init ============ */
renderTasks(); renderDaily();
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});

/* ============ service worker (offline) ============ */
if('serviceWorker' in navigator && location.protocol!=='file:'){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
